# Runs the test suite inside headless Blender and builds the extension zip.
name: Test suite

on:
  push:
    branches: [master]
  # No branch filter, so pull requests against any base branch run the suite.
  pull_request:
  workflow_call:
  schedule:
    # The weekly run additionally tests the daily Blender development build.
    - cron: '0 5 * * 1'

jobs:
  test:
    name: "Blender ${{ matrix.blender-version }}"
    runs-on: ubuntu-latest
    # The daily Blender build only runs on the weekly schedule, so letting it
    # fail the (scheduled) workflow is the early-warning signal we want; it
    # never gates pull requests or releases.
    strategy:
      fail-fast: false
      matrix:
        blender-version: ${{ fromJSON(github.event_name == 'schedule' && '["4.2", "4.5", "daily"]' || '["4.2", "4.5"]') }}

    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install host Python dependencies
      run: python -m pip install --upgrade requests

    - name: Retrieve Blender full version
      id: blender-version
      run: echo "version=$(python scripts/blender_downloader.py ${{ matrix.blender-version }} --print-version)" >> "$GITHUB_OUTPUT"

    - name: Cache Blender archive
      id: cache-blender
      uses: actions/cache@v4
      with:
        path: blender
        key: ${{ runner.os }}-${{ steps.blender-version.outputs.version }}

    - name: Download Blender
      if: steps.cache-blender.outputs.cache-hit != 'true'
      run: python scripts/blender_downloader.py ${{ matrix.blender-version }} -o blender

    - name: Install test dependencies into Blender's Python
      run: |
        blender_python=$(find blender -path '*/python/bin/python3*' -type f -print -quit)
        echo "Blender Python is $blender_python"
        "$blender_python" -m ensurepip
        "$blender_python" -m pip install --upgrade pip
        "$blender_python" -m pip install pytest mitsuba==3.9.0

    - name: Run the test suite
      run: BLENDER="$PWD/blender/blender" python tests/run.py --all

  package:
    name: Package extension
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install host Python dependencies
      run: python -m pip install --upgrade requests

    - name: Retrieve Blender full version
      id: blender-version
      run: echo "version=$(python scripts/blender_downloader.py 4.2 --print-version)" >> "$GITHUB_OUTPUT"

    - name: Cache Blender archive
      id: cache-blender
      uses: actions/cache@v4
      with:
        path: blender
        key: ${{ runner.os }}-${{ steps.blender-version.outputs.version }}

    - name: Download Blender
      if: steps.cache-blender.outputs.cache-hit != 'true'
      run: python scripts/blender_downloader.py 4.2 -o blender

    - name: Build the extension with bundled wheels
      run: python release/build_extension.py --blender blender/blender --output-dir dist

    - name: Upload the extension zips
      uses: actions/upload-artifact@v4
      with:
        name: extension-zips
        path: dist/*.zip
        if-no-files-found: error
