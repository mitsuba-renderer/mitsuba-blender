# Runs on every commit on the master branch. It runs the test suite, builds
# the extension zips, and updates the rolling "nightly" release.
name: Nightly Release

on:
  push:
    branches: [master]

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    name: "Publish nightly release"
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Download the extension zips
      uses: actions/download-artifact@v4
      with:
        name: extension-zips
        path: dist

    - name: Advance `latest` tag
      uses: actions/github-script@v7
      with:
        script: |
          try {
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "tags/latest"
            })
          } catch (e) {
            console.log("The latest tag doesn't exist yet: " + e)
          }
          await github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: "refs/tags/latest",
            sha: context.sha
          })

    - name: Create GitHub nightly release
      uses: ncipollo/release-action@v1
      with:
        name: "Nightly Release"
        prerelease: true
        allowUpdates: true
        replacesArtifacts: true
        artifacts: "dist/*.zip"
        artifactErrorsFailBuild: true
        tag: "latest"
        bodyFile: "release/nightly_release_body.md"
